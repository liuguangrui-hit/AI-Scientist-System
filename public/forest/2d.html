<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">

<title>动态假设-证据森林 · 二维</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--ink:#E7ECF5;--mut:#9AA6BF;--faint:#5C6883;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#04060B}
body{font-family:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#neb{z-index:0}#trail{z-index:1}#main{z-index:2;cursor:grab}
#main.drag{cursor:grabbing}
.ui{position:fixed;z-index:5;pointer-events:none}
.panel{background:rgba(9,13,22,.72);backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:10px}
#hud{left:20px;top:18px;width:268px;pointer-events:auto}
#hud .hd{padding:13px 15px 11px;border-bottom:1px solid var(--line)}
#hud h1{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.2px}
#hud .sub{margin-top:4px;font-size:11.5px;color:var(--faint);line-height:1.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:rgba(9,13,22,.5);padding:9px 12px}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;letter-spacing:-.3px}
.stat span{font-size:10.5px;color:var(--faint)}
.legend{padding:11px 14px 12px;display:flex;flex-direction:column;gap:6px}
.lg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);cursor:pointer;user-select:none}
.lg i{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 9px currentColor}
.lg em{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);font-style:normal}
.lg.off{opacity:.32}
.keys{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:11px;line-height:1.85;color:var(--faint)}
.keys kbd{font-family:'IBM Plex Mono',monospace;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mut)}
#inspect{right:20px;top:18px;width:296px;pointer-events:auto;opacity:0;transform:translateY(-6px);transition:.22s}
#inspect.on{opacity:1;transform:none}
#inspect .bd{padding:13px 15px}
#inspect .id{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500}
#inspect .claim{margin-top:7px;font-size:13px;line-height:1.75}
#inspect .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.07);color:var(--mut);white-space:nowrap}
.chip.mono{font-family:'IBM Plex Mono',monospace}
.ev{margin-top:11px;border-top:1px solid var(--line);padding-top:9px;max-height:190px;overflow:auto}
.ev div{display:flex;gap:8px;font-size:11px;padding:3px 0;color:var(--mut)}
.ev b{font-family:'IBM Plex Mono',monospace;font-weight:500;margin-left:auto}
#tip{position:fixed;z-index:6;pointer-events:none;opacity:0;transition:opacity .12s;padding:7px 10px;font-size:11.5px;max-width:320px;line-height:1.6}
#tip .t{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint)}
#bottom{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:7px 9px;pointer-events:auto}
button.b{font:inherit;font-size:11.5px;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
button.b:hover{color:#fff;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1)}
button.b.on{color:#0A0C10;background:#E7ECF5;border-color:#E7ECF5;font-weight:600}
#bottom .sep{width:1px;height:18px;background:var(--line)}
#bottom label{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
input[type=range]{width:86px;accent-color:#7DA2FF}
#title{left:50%;top:18px;transform:translateX(-50%);text-align:center;font-size:11.5px;color:var(--faint);letter-spacing:.4px}
#title b{color:var(--mut);font-weight:500}
a{color:#7DA2FF;text-decoration:none}
/* ---- 手机 ---- */
canvas{touch-action:none;-webkit-user-select:none;user-select:none}
#bLegend{display:none}
.touchkeys{display:none}
@media (pointer:coarse){.touchkeys{display:block}.mousekeys{display:none}}
@media (max-width:820px){
  #hud{display:none;left:12px;right:12px;top:auto;width:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-height:58vh;overflow:auto}
  body.legend #hud{display:block}
  #inspect{left:12px;right:12px;top:auto;width:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow:auto;pointer-events:none}
  #inspect.on{pointer-events:auto}
  body.legend #inspect{display:none}
  #bottom{left:12px;right:12px;transform:none;bottom:calc(12px + env(safe-area-inset-bottom,0px));overflow-x:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #bottom::-webkit-scrollbar{display:none}
  #bottom label input{width:64px}
  #bLegend{display:inline-block}
  #title{top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;transform:none;display:flex;justify-content:center;font-size:11px}
  #tip{display:none}
}
/* 嵌入模式：hero = 工作台首页背景，只留画面；embed = 工作台内嵌，去掉独立站的导航 */
body.hero #hud,body.hero #bottom,body.hero #title,body.hero #inspect{display:none!important}
body.embed #title{display:none}
</style>

<body>
<script>(function(){var m=new URLSearchParams(location.search).get('mode');if(m==='hero'||m==='embed')document.body.classList.add(m);})();</script>
<canvas id="neb"></canvas><canvas id="trail"></canvas><canvas id="main"></canvas>

<div class="ui panel" id="hud">
  <div class="hd">
    <h1>动态假设-证据森林</h1>
    <div class="sub">每棵树对应一个 idea 的论证结构；<br>树之间通过共享假设相连。</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="keys"><div class="mousekeys">
    <kbd>拖动节点</kbd> 释放后保留惯性 · <kbd>空格</kbd> 冻结<br>
    <kbd>滚轮</kbd> 缩放 · <kbd>拖背景</kbd> 平移 · <kbd>双击</kbd> 复位<br>
    <kbd>L</kbd> 标签 · <kbd>E</kbd> 证据流 · <kbd>H</kbd> 簇边界 · <kbd>R</kbd> 重新生成
  </div><div class="touchkeys"><kbd>单指拖点</kbd> 释放后保留惯性 · <kbd>拖空白</kbd> 平移 · <kbd>双指</kbd> 缩放 · <kbd>点一个点</kbd> 看证据</div></div>
</div>

<div class="ui panel" id="inspect"><div class="bd" id="inspectBody"></div></div>

<div class="ui panel" id="bottom">
  <button class="b" id="bLegend">图例</button>
  <button class="b" id="bFreeze">冻结</button>
  <button class="b on" id="bEv">证据流</button>
  <button class="b on" id="bHull">簇边界</button>
  <button class="b" id="bLabel">标签</button>
  <button class="b on" id="bSpin">自转</button>
  <div class="sep"></div>
  <label>规模 <input type="range" id="rScale" min="12" max="84" step="2" value="48"><span id="scaleV">48</span></label>
  <div class="sep"></div>
  <button class="b" id="bReseed">重新生成</button>
</div>

<script src="lib/data.js"></script>
<script src="lib/palette.js"></script>
<script src="lib/sim.js"></script>
<script>
(function () {
'use strict';
const P = window.Palette, S = P.STATUS;
// 数据自带中英两份：lang=en 时悬停、标签、图例用英文
const LG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
const neb = document.getElementById('neb'), trail = document.getElementById('trail'), main = document.getElementById('main');
const nc = neb.getContext('2d'), tc = trail.getContext('2d'), mc = main.getContext('2d');
const PHONE = matchMedia('(pointer: coarse)').matches && Math.min(window.screen.width, window.screen.height) < 820;
let W = 0, H = 0, DPR = Math.min(2, devicePixelRatio || 1), CULL = 2000;

// ---------------------------------------------------------------- 世界
let F, sim, N, index, clusterOf, ideaOf, sprites = {}, evSprite = {};
let view = { x: 0, y: 0, k: 1, rot: 0 }, target = { x: 0, y: 0, k: 1 };
let opts = { evidence: true, hulls: true, labels: false, frozen: false, spin: true, scale: PHONE ? 36 : 48 };
let hover = -1, selected = -1, sparks = [], rings = [], t0 = performance.now(), lastT = t0;

function resize() {
  W = innerWidth; H = innerHeight;
  CULL = Math.hypot(W, H) / 2 + 60;              // 旋转后仍可能进入画面的范围
  for (const c of [neb, trail, main]) { c.width = W * DPR; c.height = H * DPR; }
  nc.setTransform(DPR, 0, 0, DPR, 0, 0);
  tc.setTransform(DPR, 0, 0, DPR, 0, 0);
  mc.setTransform(DPR, 0, 0, DPR, 0, 0);
  tc.clearRect(0, 0, W, H);
}
addEventListener('resize', resize);

const mix = (a, b, t) => [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)];
let themeRgb = {};
function buildSprites() {
  sprites = {};
  for (const k in S) sprites[k] = P.sprite(S[k].rgb, 96);
  evSprite.pos = P.sprite(P.EVIDENCE.pos, 48, 0.1);
  evSprite.neg = P.sprite(P.EVIDENCE.neg, 48, 0.1);
  sprites.white = P.sprite([255, 255, 255], 96);
}

function seedWorld(seed, ideaCount) {
  F = Forest.build({ ideas: ideaCount, seed: seed });
  N = F.hyps.length;
  index = new Map(F.hyps.map((h, i) => [h.id, i]));

  // 每个假设归属它的第一个 idea（作为簇），共享的会被别的簇一起拉扯
  clusterOf = new Int32Array(N);
  ideaOf = new Array(N);
  const ideaIdx = new Map(F.ideas.map((d, i) => [d.id, i]));
  F.hyps.forEach((h, i) => {
    ideaOf[i] = h.ideas[0];
    // 共享的假设不归任何一个簇：它由几棵树共同牵着
    clusterOf[i] = h.ideas.length > 1 ? -1 : (ideaIdx.get(h.ideas[0]) ?? 0);
  });

  const links = F.edges.map((e) => ({
    a: index.get(e.a), b: index.get(e.b),
    k: e.kind === 'tree' ? 0.040 : e.kind === 'cross' ? 0.0007 : 0.0012,
    len: e.kind === 'tree' ? 24 : 420,
    kind: e.kind,
  })).filter((l) => l.a != null && l.b != null);

  // 锚点拉的是整棵树（质心），枝叶自由；受力封顶 + 较轻的阻尼，
  // 于是甩一片叶子，它带着惯性飞出去、拖着树晃、再荡回来。
  sim = new Sim({ dim: 2, repel: 620, gravity: 0.00012, cluster: 0.002, anchor: 0.02, radial: 0.075,
    damping: 0.955, maxV: 30, maxF: 3, separate: 210, sharedK: 0.045 });
  sim.load(N, links, clusterOf, F.ideas.length);
  sim.shared = [];
  F.hyps.forEach((h, i) => { if (h.ideas.length > 1) sim.shared.push({ i, cs: h.ideas.map((id) => ideaIdx.get(id)).filter((x) => x != null) }); });

  // 簇锚点：六个研究方向各占一瓣。共享大多发生在同一方向内，
  // 因此同方向的 idea 相邻布局，共享边较短；跨方向共享形成少数长边。
  const themes = F.themes.map((t) => t.id);
  const byTheme = themes.map((t) => F.ideas.filter((d) => d.theme === t));
  const petal = 250 + F.ideas.length * 13;        // 花瓣中心离原点的距离
  byTheme.forEach((list, t) => {
    const th = (t / themes.length) * Math.PI * 2 - Math.PI / 2;
    const cx = Math.cos(th) * petal, cy = Math.sin(th) * petal;
    list.forEach((d, k) => {
      // 瓣内用黄金角小螺旋，并朝外略微拉长，像花瓣
      const a = k * 2.39996323 + th, r = 118 * Math.sqrt(k + 0.35);
      const along = Math.cos(a - th) * r * 1.25, across = Math.sin(a - th) * r * 0.85;
      d.ax = cx + Math.cos(th) * along - Math.sin(th) * across;
      d.ay = cy + Math.sin(th) * along + Math.cos(th) * across;
    });
  });
  F.ideas.forEach((d, i) => { sim.canchor[i * 3] = d.ax; sim.canchor[i * 3 + 1] = d.ay; });
  for (let i = 0; i < N; i++) {
    const h = F.hyps[i];
    if (clusterOf[i] < 0) {
      const ds = h.ideas.map((id) => F.ideas[ideaIdx.get(id)]).filter(Boolean);
      sim.pos[i * 3] = ds.reduce((a, d) => a + d.ax, 0) / ds.length + (Math.random() - 0.5) * 30;
      sim.pos[i * 3 + 1] = ds.reduce((a, d) => a + d.ay, 0) / ds.length + (Math.random() - 0.5) * 30;
      continue;
    }
    const c = clusterOf[i], d = F.ideas[c];
    const dep = h.depth || 0;
    sim.radius[i] = 14 + dep * 19 + (h.leaf ? 7 : 0);
    const a = Math.random() * 6.2832, r = sim.radius[i];
    sim.pos[i * 3] = d.ax + Math.cos(a) * r;
    sim.pos[i * 3 + 1] = d.ay + Math.sin(a) * r;
  }
  sim.reheat(1);
  // 开头那段模拟最剧烈：节点被斥力和径向弹簧一把推开、过冲、再弹回，画出来就是「抖一下」。
  // 这段先在屏幕外跑完（取景也按跑完后的布局算）；剩下的平缓收敛藏在展开动画里。
  for (let k = 0; sim.alpha > 0.25 && k < 400; k++) sim.step(0.016);
  const delay = new Float32Array(N);
  let last = 0;
  for (let i = 0; i < N; i++) {
    const dep = F.hyps[i].depth || 0;
    delay[i] = clusterOf[i] < 0 ? dep * GROW.step + GROW.shared : dep * GROW.step;
    last = Math.max(last, delay[i]);
  }
  const trees = F.hyps.map((h, i) => (clusterOf[i] < 0 ? h.ideas.map((id) => ideaIdx.get(id)).filter((k) => k != null) : null));
  grow = { t0: performance.now(), delay, trees, end: last + GROW.dur };
  VP = reveal(grow.t0);
  themeRgb = {};
  for (const t of F.themes) themeRgb[t.id] = P.hueRgb(t.hue, 78, 64);
  sparks = []; rings = []; selected = -1; hover = -1;
  tc.clearRect(0, 0, W, H);
  drawHud();
  fit(true);
  window.__forest = { sim, F, view, sx, sy, get shown() { return VP; } };   // 调试用：控制台里可以直接看
}

// 展开：只作用于画面，不碰模拟。每棵树从树心按层向外张开，共享假设最后从各树之间浮现。
// 缓出曲线，不过冲，所以不会抖。
const GROW = { step: 130, shared: 220, dur: 1000 };
let grow = null, VP = null, gpos = null;
function reveal(now) {
  if (!grow) return sim.pos;
  const t = now - grow.t0;
  if (t >= grow.end) { grow = null; return sim.pos; }
  if (!gpos || gpos.length !== sim.pos.length) gpos = new Float64Array(sim.pos.length);
  const p = sim.pos, a = sim.canchor;
  for (let i = 0; i < N; i++) {
    const u = Math.min(1, Math.max(0, (t - grow.delay[i]) / GROW.dur));
    const e = 1 - (1 - u) * (1 - u) * (1 - u);
    const c = clusterOf[i];
    let ox, oy;
    if (c >= 0) { ox = a[c * 3]; oy = a[c * 3 + 1]; }
    else {                                                            // 共享：从引用它的各树中点收拢处浮现
      const cs = grow.trees[i]; let n = 0; ox = 0; oy = 0;
      for (const k of cs) { ox += a[k * 3]; oy += a[k * 3 + 1]; n++; }
      if (n) { ox /= n; oy /= n; } else { ox = p[i * 3]; oy = p[i * 3 + 1]; }
    }
    const s = 0.08 + 0.92 * e;
    gpos[i * 3] = ox + (p[i * 3] - ox) * s;
    gpos[i * 3 + 1] = oy + (p[i * 3 + 1] - oy) * s;
  }
  return gpos;
}

function fit(instant) {
  let lo = [1e9, 1e9], hi = [-1e9, -1e9];
  for (let i = 0; i < N; i++) {
    lo[0] = Math.min(lo[0], sim.pos[i * 3]); hi[0] = Math.max(hi[0], sim.pos[i * 3]);
    lo[1] = Math.min(lo[1], sim.pos[i * 3 + 1]); hi[1] = Math.max(hi[1], sim.pos[i * 3 + 1]);
  }
  const w = hi[0] - lo[0] + 180, h = hi[1] - lo[1] + 180;
  target.k = Math.min(W / w, H / h, 1.6);
  target.x = (lo[0] + hi[0]) / 2; target.y = (lo[1] + hi[1]) / 2;
  if (instant) { view.k = target.k; view.x = target.x; view.y = target.y; }
}

const sx = (x) => (x - view.x) * view.k + W / 2;
const sy = (y) => (y - view.y) * view.k + H / 2;
const wx = (x) => (x - W / 2) / view.k + view.x;
const wy = (y) => (y - H / 2) / view.k + view.y;

// 自转是整张画面绕屏幕中心转：绘制层加一个旋转变换，
// 文字按旋转后的位置摆正（字不跟着倒），鼠标坐标做一次逆旋转再去拾取。
function spinT(ctx) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.translate(W / 2, H / 2); ctx.rotate(view.rot); ctx.translate(-W / 2, -H / 2); }
function plainT(ctx) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
function spinPt(x, y) { const c = Math.cos(view.rot), s = Math.sin(view.rot), dx = x - W / 2, dy = y - H / 2; return [W / 2 + dx * c - dy * s, H / 2 + dx * s + dy * c]; }
function unspin(x, y) { const c = Math.cos(-view.rot), s = Math.sin(-view.rot), dx = x - W / 2, dy = y - H / 2; return [W / 2 + dx * c - dy * s, H / 2 + dx * s + dy * c]; }

// ---------------------------------------------------------------- 绘制
function drawNebula() {
  nc.save(); plainT(nc); nc.clearRect(0, 0, W, H); nc.restore();
  nc.globalCompositeOperation = 'lighter';
  // 六片花瓣的底色
  F.themes.forEach((t, k) => {
    const list = F.ideas.filter((d) => d.theme === t.id && d.cx != null);
    if (!list.length) return;
    const x = sx(list.reduce((a, d) => a + d.cx, 0) / list.length), y = sy(list.reduce((a, d) => a + d.cy, 0) / list.length);
    const r = 520 * view.k;
    const g = nc.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, P.hsl(t.hue, 70, 50, 0.07));
    g.addColorStop(1, P.hsl(t.hue, 70, 40, 0));
    nc.fillStyle = g; nc.fillRect(x - r, y - r, r * 2, r * 2);
  });
  // 中心区域的背景光晕（跨方向边捆绑汇聚处）
  { const x = sx(0), y = sy(0), r = 420 * view.k;
    const g = nc.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(160,190,255,0.06)'); g.addColorStop(1, 'rgba(160,190,255,0)');
    nc.fillStyle = g; nc.fillRect(x - r, y - r, r * 2, r * 2); }
  for (const d of F.ideas) {
    const x = sx(d.cx || d.ax), y = sy(d.cy || d.ay);
    const r = (58 + (d.nodes.length * 7)) * view.k * 1.7;
    if (x < -r || x > W + r || y < -r || y > H + r) continue;
    const g = nc.createRadialGradient(x, y, 0, x, y, r);
    const live = d.status === 'running' || d.status === 'candidate';
    g.addColorStop(0, P.hsl(d.hue, 72, 56, live ? 0.085 : 0.03));
    g.addColorStop(0.45, P.hsl(d.hue, 70, 46, live ? 0.032 : 0.012));
    g.addColorStop(1, P.hsl(d.hue, 70, 40, 0));
    nc.fillStyle = g;
    nc.fillRect(x - r, y - r, r * 2, r * 2);
  }
  nc.globalCompositeOperation = 'source-over';
}

function hull(points) {                       // Andrew monotone chain
  if (points.length < 3) return points;
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

function drawHulls() {
  const groups = new Map();
  for (let i = 0; i < N; i++) {
    if (F.hyps[i].ideas.length > 1) continue;   // 共享假设不计入任何簇的边界
    const c = clusterOf[i];
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push([sx(VP[i * 3]), sy(VP[i * 3 + 1])]);
  }
  for (const [c, pts] of groups) {
    const d = F.ideas[c];
    if (!d || c < 0) continue;
    const hp = hull(pts);
    if (hp.length < 3) continue;
    const dim = selected >= 0 && ideaOf[selected] !== d.id && !F.hyps[selected].ideas.includes(d.id);
    mc.beginPath();
    for (let i = 0; i < hp.length; i++) {
      const a = hp[i], b = hp[(i + 1) % hp.length];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      if (i === 0) mc.moveTo(mx, my); else mc.quadraticCurveTo(a[0], a[1], mx, my);
    }
    mc.closePath();
    const live = d.status === 'running';
    mc.fillStyle = P.hsl(d.hue, 60, 50, dim ? 0.012 : live ? 0.055 : 0.028);
    mc.fill();
    mc.strokeStyle = P.hsl(d.hue, 70, 62, dim ? 0.05 : live ? 0.26 : 0.12);
    mc.lineWidth = live ? 1.1 : 0.7;
    if (!live) mc.setLineDash([5, 6]);
    mc.stroke();
    mc.setLineDash([]);
  }
}

function drawEdges() {
  const sel = selected >= 0 ? F.hyps[selected] : null;
  const ox = sx(0), oy = sy(0);
  const BUNDLE = 300;                         // 世界坐标里超过这个长度的边，弯向林心成束

  // 第一遍：跨方向长边，叠加混合，按边捆绑方式弯向中心
  mc.globalCompositeOperation = 'lighter';
  mc.lineWidth = 0.9;
  for (const e of F.edges) {
    const a = index.get(e.a), b = index.get(e.b);
    if (a == null || b == null) continue;
    const pax = VP[a * 3], pay = VP[a * 3 + 1], pbx = VP[b * 3], pby = VP[b * 3 + 1];
    const len = Math.hypot(pbx - pax, pby - pay);
    if (len < BUNDLE) continue;
    const near = sel && (a === selected || b === selected);
    if (sel && !near) continue;
    const ax = sx(pax), ay = sy(pay), bx = sx(pbx), by = sy(pby);
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const pull = Math.min(0.78, 0.35 + len / 2600);
    const cx = mx + (ox - mx) * pull, cy = my + (oy - my) * pull;
    const hb = F.hyps[b];
    const col = e.kind === 'induced' ? [167, 139, 250] : e.kind === 'cross' ? [125, 162, 255] : S[hb.status].rgb;
    mc.strokeStyle = P.css(col, near ? 0.85 : 0.075);
    mc.lineWidth = near ? 1.6 : 0.9;
    mc.beginPath(); mc.moveTo(ax, ay); mc.quadraticCurveTo(cx, cy, bx, by); mc.stroke();
  }
  mc.globalCompositeOperation = 'source-over';

  // 第二遍：树内的枝条，两段上色，从父的状态渐到子的状态
  for (const e of F.edges) {
    const a = index.get(e.a), b = index.get(e.b);
    if (a == null || b == null) continue;
    const pax = VP[a * 3], pay = VP[a * 3 + 1], pbx = VP[b * 3], pby = VP[b * 3 + 1];
    if (Math.hypot(pbx - pax, pby - pay) >= BUNDLE) continue;
    const ax = sx(pax), ay = sy(pay), bx = sx(pbx), by = sy(pby);
    if ((ax < 0 && bx < 0) || (ax > W && bx > W) || (ay < 0 && by < 0) || (ay > H && by > H)) continue;
    const near = sel && (a === selected || b === selected);
    let alpha = e.kind === 'tree' ? 0.34 : 0.24;
    if (sel && !near) alpha *= 0.14;
    const ha = F.hyps[a], hb = F.hyps[b];
    mc.lineWidth = near ? 1.8 : e.kind === 'tree' ? 0.95 : 0.7;
    if (e.kind === 'tree') {
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      const tint = themeRgb[hb.theme];
      mc.strokeStyle = P.css(mix(S[ha.status].rgb, tint, 0.55), near ? 0.9 : alpha * 0.8);
      mc.beginPath(); mc.moveTo(ax, ay); mc.lineTo(mx, my); mc.stroke();
      mc.strokeStyle = P.css(mix(S[hb.status].rgb, tint, 0.35), near ? 0.9 : alpha);
      mc.beginPath(); mc.moveTo(mx, my); mc.lineTo(bx, by); mc.stroke();
    } else {
      mc.setLineDash(e.kind === 'cross' ? [3, 6] : [2, 4]);
      mc.strokeStyle = P.css(e.kind === 'cross' ? [125, 162, 255] : [167, 139, 250], near ? 0.9 : alpha);
      const mx = (ax + bx) / 2, my = (ay + by) / 2, dx = bx - ax, dy = by - ay;
      mc.beginPath(); mc.moveTo(ax, ay); mc.quadraticCurveTo(mx - dy * 0.16, my + dx * 0.16, bx, by); mc.stroke();
      mc.setLineDash([]);
    }
  }
}

function drawNodes(now) {
  mc.globalCompositeOperation = 'lighter';
  const sel = selected >= 0 ? F.hyps[selected] : null;
  for (let i = 0; i < N; i++) {
    const h = F.hyps[i];
    const x = sx(VP[i * 3]), y = sy(VP[i * 3 + 1]);
    if (Math.abs(x - W / 2) > CULL || Math.abs(y - H / 2) > CULL) continue;
    const st = S[h.status];
    const shareBoost = 1 + (h.ideas.length - 1) * 0.42;
    let r = (2.4 + Math.min(3.2, h.evidence.length * 0.36)) * shareBoost * view.k;
    r = Math.max(1.1, Math.min(26, r));
    let glow = st.glow * (1 + (h.ideas.length - 1) * 0.5);
    if (h.status === 'testing') glow *= 0.75 + 0.45 * (0.5 + 0.5 * Math.sin(now / 320 + i));
    let dim = 1;
    if (sel) {
      const related = i === selected || sel.ideas.some((d) => h.ideas.includes(d));
      dim = related ? 1 : 0.13;
    }
    const g = r * (3.4 + glow * 3.2);
    mc.globalAlpha = Math.min(0.62, glow * 0.34) * dim;
    mc.drawImage(sprites[h.status], x - g, y - g, g * 2, g * 2);
    mc.globalAlpha = dim;
    mc.drawImage(sprites[h.status], x - r * 1.5, y - r * 1.5, r * 3, r * 3);
    if (h.ideas.length > 1) {                    // 被多棵树引用的，戴一圈环
      mc.globalCompositeOperation = 'source-over';
      mc.globalAlpha = dim * (0.28 + 0.1 * h.ideas.length);
      mc.strokeStyle = P.css([255, 255, 255], 1);
      mc.lineWidth = Math.max(0.6, 0.9 * view.k);
      mc.beginPath(); mc.arc(x, y, r * 2.1, 0, 6.2832); mc.stroke();
      mc.globalCompositeOperation = 'lighter';
    }
    if (i === hover || i === selected) {
      mc.globalAlpha = 1;
      mc.drawImage(sprites.white, x - r * 3.4, y - r * 3.4, r * 6.8, r * 6.8);
    }
  }
  mc.globalAlpha = 1;
  mc.globalCompositeOperation = 'source-over';
}

function drawLabels() {
  mc.textAlign = 'center';
  for (const d of F.ideas) {
    if (d.cx == null) continue;
    const [x, y] = spinPt(sx(d.cx), sy(d.cy));
    if (x < -80 || x > W + 80 || y < -40 || y > H + 40) continue;
    const live = d.status === 'running';
    mc.font = (live ? '600 ' : '400 ') + Math.max(9, Math.min(15, 11 * Math.sqrt(view.k))) + "px 'IBM Plex Sans','Noto Sans SC',sans-serif";
    mc.fillStyle = P.hsl(d.hue, 75, 74, live ? 0.82 : 0.34);
    mc.fillText(d.name[LG], x, y - (d.rad || 30) - 6);
    if (view.k > 0.9) {
      mc.font = "400 9px 'IBM Plex Mono',monospace";
      mc.fillStyle = P.hsl(d.hue, 60, 66, 0.4);
      mc.fillText(d.id, x, y - (d.rad || 30) + 5);
    }
  }
  if (opts.labels && view.k > 0.75) {
    mc.font = "400 9.5px 'IBM Plex Mono',monospace";
    for (let i = 0; i < N; i++) {
      const h = F.hyps[i];
      if (h.ideas.length < 2 && h.status !== 'pending_review' && h.status !== 'testing') continue;
      const [x, y] = spinPt(sx(VP[i * 3]), sy(VP[i * 3 + 1]));
      if (x < 0 || x > W || y < 0 || y > H) continue;
      mc.fillStyle = P.css(S[h.status].rgb, 0.62);
      mc.fillText(h.id, x, y - 9);
    }
  }
}

// 证据顺着边流向它支撑的假设；正证据是薄荷色，负的是玫瑰色
function spawnSparks(dt) {
  if (!opts.evidence) return;
  const want = Math.min(340, Math.round(F.hyps.length * 0.4));
  let guard = 0;
  while (!grow && sparks.length < want && guard++ < 24) {          // 树展开之后才有证据流
    const e = F.evidence[(Math.random() * F.evidence.length) | 0];
    const b = index.get(e.hyp);
    if (b == null) continue;
    const parents = F.edges.filter((x) => x.b === e.hyp && x.kind === 'tree');
    const src = parents.length ? index.get(parents[(Math.random() * parents.length) | 0].a) : null;
    const a = src != null ? src : b;
    sparks.push({ a, b, t: Math.random(), v: 0.25 + Math.random() * 0.5, pos: e.delta > 0, d: e.delta });
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.t += s.v * dt;
    if (s.t >= 1) {
      rings.push({ x: VP[s.b * 3], y: VP[s.b * 3 + 1], r: 0, max: 16 + Math.abs(s.d) * 26, a: 0.5, pos: s.pos, w: 1.4 });
      sparks.splice(i, 1);
    }
  }
}

function drawSparks() {
  plainT(tc);
  tc.globalCompositeOperation = 'source-over';
  tc.fillStyle = 'rgba(4,6,11,0.17)';           // 淡淡地擦，于是留下拖尾
  tc.fillRect(0, 0, W, H);
  if (!opts.evidence) return;
  spinT(tc);
  tc.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    const ax = VP[s.a * 3], ay = VP[s.a * 3 + 1];
    const bx = VP[s.b * 3], by = VP[s.b * 3 + 1];
    const e = s.t * s.t * (3 - 2 * s.t);
    const x = sx(ax + (bx - ax) * e), y = sy(ay + (by - ay) * e);
    if (Math.abs(x - W / 2) > CULL || Math.abs(y - H / 2) > CULL) continue;
    const r = (2.0 + Math.abs(s.d) * 2.6) * Math.max(0.55, view.k) * (0.6 + 0.4 * Math.sin(s.t * Math.PI));
    const sp = s.pos ? evSprite.pos : evSprite.neg;
    tc.globalAlpha = 0.72;
    tc.drawImage(sp, x - r * 4, y - r * 4, r * 8, r * 8);
  }
  tc.globalAlpha = 1;
  tc.globalCompositeOperation = 'source-over';
}

function drawRings(dt) {
  mc.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += (r.max - r.r) * 3.2 * dt;
    r.a -= dt * 0.9;
    if (r.a <= 0) { rings.splice(i, 1); continue; }
    const col = r.col || (r.pos ? P.EVIDENCE.pos : P.EVIDENCE.neg);
    mc.strokeStyle = P.css(col, r.a * 0.8);
    mc.lineWidth = (r.w || 1.4) * view.k;
    mc.beginPath();
    mc.arc(sx(r.x), sy(r.y), r.r * view.k, 0, 6.2832);
    mc.stroke();
  }
  mc.globalCompositeOperation = 'source-over';
}

// 偶尔来一次裁定：一条待裁定的假设被拍板，冲击波沿着它的下游扩散
let verdictAt = 0;
function verdictPulse(now) {
  if (now - verdictAt < 5200 || !F.verdicts.length) return;
  verdictAt = now;
  const h = F.verdicts[(Math.random() * F.verdicts.length) | 0];
  const i = index.get(h.id);
  if (i == null) return;
  rings.push({ x: VP[i * 3], y: VP[i * 3 + 1], r: 0, max: 130, a: 0.95, col: S.pending_review.rgb, w: 2.4 });
  rings.push({ x: VP[i * 3], y: VP[i * 3 + 1], r: 0, max: 210, a: 0.5, col: [255, 255, 255], w: 1 });
  sim.reheat(0.55);                              // 冲击波把林子稍稍加热，让下游荡回原位
  for (const e of F.edges) {                    // 下游跟着颤一下
    if (e.a !== h.id) continue;
    const j = index.get(e.b);
    if (j == null) continue;
    sim.vel[j * 3] += (Math.random() - 0.5) * 9;
    sim.vel[j * 3 + 1] += (Math.random() - 0.5) * 9;
  }
}

// ---------------------------------------------------------------- 主循环
function frame(now) {
  // rAF 的时间戳可能早于启动时取的 performance.now()，负的 dt 会让指数缓动发散
  const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
  lastT = now;
  view.k += (target.k - view.k) * 0.12;
  view.x += (target.x - view.x) * 0.12;
  view.y += (target.y - view.y) * 0.12;

  if (opts.spin && !drag) view.rot += dt * 0.018;      // 自转转的是视角：林子冷却后本身一动不动
  if (!opts.frozen) { sim.step(0.016); sim.step(0.016); }
  VP = reveal(now);

  for (const d of F.ideas) { d.cx = 0; d.cy = 0; d.n = 0; }
  for (let i = 0; i < N; i++) {
    if (clusterOf[i] < 0) continue;
    const d = F.ideas[clusterOf[i]];
    d.cx += VP[i * 3]; d.cy += VP[i * 3 + 1]; d.n++;
  }
  for (const d of F.ideas) if (d.n) { d.cx /= d.n; d.cy /= d.n; } else { d.cx = d.ax; d.cy = d.ay; }
  for (const d of F.ideas) {
    let m = 0;
    for (let i = 0; i < N; i++) if (clusterOf[i] === d.idx) m = Math.max(m, Math.hypot(VP[i * 3] - d.cx, VP[i * 3 + 1] - d.cy));
    d.rad = m * view.k;
  }

  spawnSparks(dt);
  verdictPulse(now);

  spinT(nc); drawNebula();
  drawSparks();
  plainT(mc); mc.clearRect(0, 0, W, H);
  spinT(mc);
  if (opts.hulls) drawHulls();
  drawEdges();
  drawRings(dt);
  drawNodes(now);
  plainT(mc);
  drawLabels();

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.6) { window.__fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
let fpsAcc = 0, fpsN = 0;

// ---------------------------------------------------------------- 交互
let drag = null, panning = null, lastPointer = 0, pinch = null;
const touches = new Map();                       // 当前按在屏幕上的指针
const COARSE = matchMedia('(pointer: coarse)').matches;
function pick(px, py) {
  [px, py] = unspin(px, py);
  const x = wx(px), y = wy(py);
  const reach = COARSE ? 28 : 16;                // 手指比鼠标粗
  let best = -1, bd = (reach / view.k) ** 2;
  for (let i = 0; i < N; i++) {
    const dx = VP[i * 3] - x, dy = VP[i * 3 + 1] - y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = i; }
  }
  return best;
}
function endDrag() { if (drag != null) { sim.release(drag); drag = null; } panning = null; }
function startPinch() {                          // 两指：缩放 + 平移，锚住两指中点下的世界点
  endDrag();
  const [a, b] = [...touches.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, [ux, uy] = unspin(mx, my);
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: view.k, wx: wx(ux), wy: wy(uy) };
}
main.addEventListener('pointerdown', (e) => {
  main.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) { startPinch(); return; }
  if (touches.size > 2) return;
  const i = pick(e.clientX, e.clientY);
  lastPointer = performance.now();
  if (i >= 0) { drag = i; sim.grab(i); selectNode(i); main.classList.add('drag'); }
  else { panning = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; main.classList.add('drag'); }
});
main.addEventListener('pointermove', (e) => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    view.k = target.k = Math.max(0.12, Math.min(6, pinch.k * d / pinch.d));
    const [ux, uy] = unspin((a.x + b.x) / 2, (a.y + b.y) / 2);
    view.x = target.x = pinch.wx - (ux - W / 2) / view.k;
    view.y = target.y = pinch.wy - (uy - H / 2) / view.k;
    return;
  }
  if (drag != null) {
    const now = performance.now(), dt = Math.max(0.008, (now - lastPointer) / 1000);
    lastPointer = now;
    const [ux, uy] = unspin(e.clientX, e.clientY);
    sim.dragTo(drag, [wx(ux), wy(uy)], dt);
    return;
  }
  if (panning) {
    const c = Math.cos(-view.rot), sn = Math.sin(-view.rot), dx = e.clientX - panning.x, dy = e.clientY - panning.y;
    target.x = panning.vx - (dx * c - dy * sn) / view.k;
    target.y = panning.vy - (dx * sn + dy * c) / view.k;
    view.x = target.x; view.y = target.y;
    return;
  }
  if (e.pointerType === 'mouse') {
    const i = pick(e.clientX, e.clientY);
    if (i !== hover) { hover = i; showTip(i, e.clientX, e.clientY); }
    else if (i >= 0) moveTip(e.clientX, e.clientY);
  }
});
function pointerEnd(e) {
  touches.delete(e.pointerId);
  if (pinch) { if (touches.size < 2) pinch = null; return; }   // 两指松开一指：不当作一次拖拽结束
  endDrag();
  main.classList.remove('drag');
}
addEventListener('pointerup', pointerEnd);
addEventListener('pointercancel', pointerEnd);
main.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 0.88 : 1.14;
  const [ux, uy] = unspin(e.clientX, e.clientY);
  const mxw = wx(ux), myw = wy(uy);
  target.k = Math.max(0.12, Math.min(6, target.k * f));
  view.k = target.k;
  target.x = mxw - (ux - W / 2) / view.k;
  target.y = myw - (uy - H / 2) / view.k;
  view.x = target.x; view.y = target.y;
}, { passive: false });
main.addEventListener('dblclick', () => { selectNode(-1); fit(); });

const tip = document.getElementById('tip');
function showTip(i, x, y) {
  if (i < 0) { tip.style.opacity = 0; return; }
  const h = F.hyps[i];
  tip.innerHTML = '<div class="t">' + h.id + ' · ' + S[h.status][LG] + ' · ' + (h.score > 0 ? '+' : '') + h.score + '</div>' + h.claim[LG];
  tip.style.opacity = 1;
  moveTip(x, y);
}
function moveTip(x, y) {
  tip.style.left = Math.min(W - 330, x + 16) + 'px';
  tip.style.top = (y + 18) + 'px';
}

const inspect = document.getElementById('inspect'), inspectBody = document.getElementById('inspectBody');
function selectNode(i) {
  selected = i;
  if (i < 0) { inspect.classList.remove('on'); return; }
  const h = F.hyps[i];
  const ideas = h.ideas.map((id) => F.ideas.find((d) => d.id === id)).filter(Boolean);
  inspectBody.innerHTML =
    '<div class="id" style="color:' + P.css(S[h.status].rgb) + '">' + h.id + ' · ' + S[h.status][LG] + '</div>' +
    '<div class="claim">' + h.claim[LG] + '</div>' +
    '<div class="row"><span class="chip mono">累积 ' + (h.score > 0 ? '+' : '') + h.score + '</span>' +
      '<span class="chip">证据 ' + h.evidence.length + '</span>' +
      (h.ideas.length > 1 ? '<span class="chip" style="background:rgba(125,162,255,.18);color:#AFC6FF">被 ' + h.ideas.length + ' 棵树共享</span>' : '') + '</div>' +
    '<div class="row">' + ideas.map((d) => '<span class="chip mono" style="color:' + P.hsl(d.hue, 70, 72) + '">' + d.id + ' ' + d.name[LG] + '</span>').join('') + '</div>' +
    (h.evidence.length ? '<div class="ev">' + h.evidence.slice(0, 14).map((e) =>
      '<div><span style="font-family:\'IBM Plex Mono\',monospace;color:#5C6883">' + e.id + '</span><span>' + e.idea + '</span>' +
      '<b style="color:' + (e.delta > 0 ? '#6EE7B7' : '#FB7185') + '">' + (e.delta > 0 ? '+' : '') + e.delta + '</b></div>').join('') + '</div>' : '');
  inspect.classList.add('on');
}

// ---------------------------------------------------------------- HUD
function drawHud() {
  const s = F.stats;
  document.getElementById('stats').innerHTML = [
    [s.ideas, 'idea（树）'], [s.hyps, '假设（节点）'],
    [s.shared, '被共享的假设'], [s.edges, '边'],
    [s.evidence, '证据'], [s.maxShare, '最多被几棵树共用'],
  ].map(([v, k]) => '<div class="stat"><b>' + v.toLocaleString() + '</b><span>' + k + '</span></div>').join('');
  const counts = {};
  for (const h of F.hyps) counts[h.status] = (counts[h.status] || 0) + 1;
  document.getElementById('legend').innerHTML = Object.keys(S).map((k) =>
    '<div class="lg" data-k="' + k + '"><i style="background:' + P.css(S[k].rgb) + ';color:' + P.css(S[k].rgb, 0.8) + '"></i>' +
    S[k][LG] + '<em>' + (counts[k] || 0) + '</em></div>').join('');
}

document.getElementById('bLegend').addEventListener('click', (e) => { document.body.classList.toggle('legend'); e.currentTarget.classList.toggle('on'); });
const bind = (id, fn, on) => {
  const el = document.getElementById(id);
  el.addEventListener('click', () => { fn(el); });
  if (on) el.classList.add('on');
};
bind('bFreeze', (el) => { opts.frozen = !opts.frozen; el.classList.toggle('on', opts.frozen); el.textContent = opts.frozen ? '继续' : '冻结'; });
bind('bEv', (el) => { opts.evidence = !opts.evidence; el.classList.toggle('on', opts.evidence); });
bind('bHull', (el) => { opts.hulls = !opts.hulls; el.classList.toggle('on', opts.hulls); });
bind('bLabel', (el) => { opts.labels = !opts.labels; el.classList.toggle('on', opts.labels); });
bind('bSpin', (el) => { opts.spin = !opts.spin; el.classList.toggle('on', opts.spin); });
bind('bReseed', () => seedWorld((Math.random() * 1e9) | 0, opts.scale));
const rs = document.getElementById('rScale'), sv = document.getElementById('scaleV');
rs.value = opts.scale; sv.textContent = opts.scale;
rs.addEventListener('input', () => { sv.textContent = rs.value; });
rs.addEventListener('change', () => { opts.scale = +rs.value; seedWorld(F.seed, opts.scale); });

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); document.getElementById('bFreeze').click(); }
  if (k === 'l') document.getElementById('bLabel').click();
  if (k === 'e') document.getElementById('bEv').click();
  if (k === 'h') document.getElementById('bHull').click();
  if (k === 'r') document.getElementById('bReseed').click();
  if (k === 'escape') selectNode(-1);
});

resize();
buildSprites();
seedWorld(20260921, opts.scale);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
